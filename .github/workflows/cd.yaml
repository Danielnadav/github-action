on: [push]


jobs:
  deploy-local:
    runs-on: self-hosted
    name: Deploy to Docker Desktop Kubernetes

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set KUBECONFIG
        run: echo "KUBECONFIG=$HOME/.kube/config" >> $GITHUB_ENV

      - name: Run kubectl command
        run: kubectl get pods -A